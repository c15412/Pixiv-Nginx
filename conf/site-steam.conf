#access_log logs/Steam-debug.log lite buffer=4k flush=5s if=$needlog;
#   Steam Start
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name .steamcommunity.com;

	access_log logs/SteamCDN-access.log lite buffer=4k flush=5s if=$needlog;
	error_log NUL;
	
	location ~* ^.*(discussions|comment|forum).*$ {
		#set $rewrite_host  "str001.steam302.xyz";
		proxy_pass https://steam-community302;
		proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504 non_idempotent;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Real_IP $remote_addr;
		proxy_http_version 1.1;
		proxy_set_header Host "steamcommunity.com";
		proxy_set_header User-Agent "${http_user_agent} Googlebot/2.1 (+http://www.google.com/bot.html)";
		proxy_buffering off;
		proxy_ssl_server_name on;
		proxy_ssl_name "statuspage.akamaized.net";
	}

	location / {
		proxy_pass https://steam-community;
		proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504 non_idempotent;
		proxy_connect_timeout 5;
		proxy_next_upstream_timeout 60;
		include shared-proxy-params-empty-sni.conf;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name .steampowered.com;

	access_log logs/SteamCDN-access.log lite buffer=4k flush=5s if=$needlog;
	error_log logs/SteamCDN-error.log;

	location / {
		proxy_pass https://$steam_backend;
		proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504 non_idempotent;
		proxy_next_upstream_timeout 90;
		include shared-proxy-params-empty-sni.conf;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name community.steamstatic.com community.fastly.steamstatic.com community.cloudflare.steamstatic.com community.akamai.steamstatic.com;

	access_log logs/SteamCDN-access.log lite buffer=4k flush=5s if=$needlog;
	error_log NUL;
	http2_max_concurrent_streams 32;

	location /market/ {
		return 307 https://steamcommunity.com$request_uri;
	}
	location / {
		proxy_pass https://steam-fastly;
		proxy_http_version 1.1;
		add_header Server-Upstream $upstream_http_server;
		proxy_next_upstream_timeout 60;
		proxy_connect_timeout 5;
		keepalive_timeout 120;
		proxy_set_header Connection "";
		proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504 non_idempotent;
		proxy_set_header Host "community.steamstatic.com";
		proxy_set_header User-Agent $http_user_agent;
		proxy_ssl_server_name on;
		proxy_ssl_name "";
		proxy_buffering off;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name steamuserimages-a.akamaihd.net;
	server_name steamcdn-a.akamaihd.net;
	server_name steamcommunity-a.akamaihd.net;

	access_log logs/SteamCDN-access.log lite buffer=4k flush=5s if=$needlog;
	error_log NUL;

	location / {
		proxy_pass https://AkamaiCDN;
		include shared-proxy-params-empty-sni.conf;
	}
}

#SteamStatic 国内cdn：白山云eccdnx：st.dl.eccdnx.com
#阿里昆仑雀牛云cdn.queniuqe.com
#dl.steam.clngaa.com
#Fastly : cdn,media,clan,avatars,video,shared

map $host $steam_static_backend {
	hostnames;
	broadcast.*	lv.queniujq.cn;
	~^(?<service>[^.]+)(?:\.[^.]+)?\.steamstatic\.com$	"${service}.cdn.queniuqe.com";
	default	steam-fastly;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name *.steamstatic.com;

	access_log logs/SteamCDN-access.log lite buffer=4k flush=5s if=$needlog;
	error_log NUL;

	location / {
		resolver 119.29.29.29 valid=300 ipv4=on ipv6=on;
		proxy_pass https://$steam_static_backend;
		proxy_http_version 1.1;
		proxy_connect_timeout 4;
		keepalive_timeout 120;
		proxy_set_header Connection "";
		proxy_set_header Host $steam_static_backend;
		proxy_set_header User-Agent $http_user_agent;
		proxy_buffering off;
		proxy_ssl_server_name on;
		proxy_ssl_name $proxy_host;
	}
}

