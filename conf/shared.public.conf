upstream AkamaiCDN {
	zone AkamaiCDN 2m;
	hash $connection consistent;
	include shared-upstream-akamai.conf;
	keepalive 32;
	keepalive_time 1h;
	keepalive_timeout 300;
	keepalive_requests 10000;
}

upstream CloudFront {
	zone CloudFront 2m;
	hash $connection consistent;
	include shared-upstream-cloudfront.conf;
	keepalive 32;
	keepalive_time 1h;
	keepalive_timeout 120;
	keepalive_requests 10000;
}

upstream CloudFlare {
	zone CloudFlare 1m;
	hash $connection consistent;
	include shared-upstream-cloudflare-ipv4.conf;
	include shared-upstream-cloudflare-ipv6.conf;
	keepalive 32;
	keepalive_time 1h;
	keepalive_timeout 120;
	keepalive_requests 10000;
}
upstream CloudFlare-LB {
	zone CloudFlare-LB 1m;
	least_conn;
	include shared-upstream-cloudflare-ipv4.conf;
	include shared-upstream-cloudflare-ipv6.conf;
	keepalive 32;
	keepalive_time 1h;
	keepalive_timeout 120;
	keepalive_requests 10000;
}

#   default_server Start
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	access_log off;
	rewrite ^(.*) https://$host$1 permanent;
}
#   default_server End

#	EA Start
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name origin-a.akamaihd.net;

	location / {
		proxy_pass https://AkamaiCDN;
		include shared-proxy-params-1.conf;
	}
}
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name api1.origin.com;

	location / {
		set $rewrite_host "api2.origin.com";
		proxy_pass https://$rewrite_host;
		include shared-proxy-params-1.conf;
	}
}
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name pc.ea.com;

	location / {
		set $rewrite_host "e8688.e12.akamaiedge.net";
		proxy_pass https://$rewrite_host:443;
		include shared-proxy-params-1.conf;
	}
}
#	EA End

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name
	wallhaven.cc	www.wallhaven.cc	static.wallhaven.cc	alpha.wallhaven.cc
	.itch.io
	.mod.io
	.cosphoria.co
	.patreon.com
	.medium.com
;

	location / {
		proxy_pass https://CloudFlare;
		proxy_next_upstream error timeout http_429 http_500 http_502 http_503 http_504;
		include shared-proxy-params-snidot.conf;
	}
}
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name
	w.wallhaven.cc	th.wallhaven.cc
	cdn.cosphoria.co
	.patreonusercontent.com
;

	location / {
		proxy_pass https://CloudFlare-LB;
		proxy_next_upstream error timeout http_429 http_500 http_502 http_503 http_504;
		include shared-proxy-params-snidot.conf;
	}
}

#主站是CloudFlare，但是极个别子站点独立，在此映射
map $host $status_backend {
	hostnames;
	status.medium.com	cname.vercel-dns.com;
	cdn-audio-1.medium.com	d4ykqdf81nuuy.cloudfront.net;
	status.mod.io	cd-70433d3ab5f4e62cdc7b0270d26dd6e3.hosted-status.pagerduty.com;
	status.huggingface.co	status.singpass.gov.sg;
}
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name
	status.medium.com
	cdn-audio-1.medium.com
	status.mod.io
;
	location / {
		resolver 119.29.29.29:53 valid=1h ipv4=on ipv6=on;
		proxy_pass https://$status_backend;
		include shared-proxy-params-1.conf;
		proxy_ssl_name $status_backend;
	}
}