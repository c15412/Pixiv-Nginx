#   huggingface Start
upstream huggingface-co {
	zone CloudFront;
	hash $connection consistent;
	#least_conn;
	#server [2600:9000:2014:7600:8:331a:2800:21]:443;
	#server [2600:9000:2014:ac00:8:331a:2800:21]:443;
	#server [2600:9000:2014:a600:8:331a:2800:21]:443;
	#server [2600:9000:2014:b600:8:331a:2800:21]:443;
	#server [2600:9000:2014:c600:8:331a:2800:21]:443;
	#server [2600:9000:2014:bc00:8:331a:2800:21]:443;
	#server [2600:9000:2014:da00:8:331a:2800:21]:443;
	server [2600:9000:2014:a400:8:331a:2800:21]:443 max_fails=0;
	server [2600:9000:2939:7600:8:331a:2800:21]:443 max_fails=0;
	server [2600:9000:2804:ce00:8:331a:2800:21]:443 max_fails=0;
	#server [2600:9000:2939:ac00:8:331a:2800:21]:443;
	#server [2600:9000:2939:a600:8:331a:2800:21]:443;
	#server [2600:9000:2939:b600:8:331a:2800:21]:443;
	#server [2600:9000:2939:c600:8:331a:2800:21]:443;
	#server [2600:9000:2939:bc00:8:331a:2800:21]:443;
	#server [2600:9000:2939:da00:8:331a:2800:21]:443;
	#server [2600:9000:2939:a400:8:331a:2800:21]:443;
	server 3.175.207.30:443 max_fails=0;
	server 3.175.207.31:443 max_fails=0;
	server 3.175.207.32:443 max_fails=0;
	server 3.175.207.33:443 max_fails=0;
	server 65.9.164.21:443;
	server 65.9.164.221:443;
	server 13.226.65.148:443;
	server 13.226.65.216:443;
	#server 54.230.70.18:443;
	#server 54.230.70.62:443;
	#server 54.230.70.64:443;
	#server 54.230.70.115:443;
	keepalive 32;
	keepalive_timeout 1h;
	keepalive_requests 100000;
}

map $http_host $huggingface_sni {
	hostnames;
	"1.huggingface.co"				"d3q5pwvs88w1av.cloudfront.net.";
	"1cdn-uploads.huggingface.co"	"d1cylya5vv74ss.cloudfront.net";
	"cdn-lfs-eu-1.huggingface.co"	"d1wmdo6fswuln8.cloudfront.net";
	"cdn-lfs-us-1.huggingface.co"	"d3tt2suyqs9zqv.cloudfront.net";
	"cdn-lfs.huggingface.co"			"d2243ylfu57tc6.cloudfront.net";
	"cdn-datasets.huggingface.co"	"d36easquyfvmrn.cloudfront.net";
	"cdn.huggingface.co"			"d2ws9o8vfrpkyk.cloudfront.net";
	"neuralconvo.huggingface.co"	"d3bh913krp35a5.cloudfront.net";
	"*.huggingface.co"				"d1cnjqbqjby1vq.cloudfront.net";
	"huggingface.co"				"d1cnjqbqjby1vq.cloudfront.net";
	default						"";
}
#cdn-avatars		d3q5pwvs88w1av.cloudfront.net
#cdn-media		d3o8kve1y18aln.cloudfront.net		v6suffix[19:6fb8:2ac0:93a1]
#cdn-uploads		d1cylya5vv74ss.cloudfront.net		v6suffix[1c:be4f:c300:93a1]
#convai			d1cnjqbqjby1vq.cloudfront.net
#neuralconvo		d3bh913krp35a5.cloudfront.net
#cdn-datasets		d36easquyfvmrn.cloudfront.net
#cdn			d2ws9o8vfrpkyk.cloudfront.net
#cdn-lfs			d2243ylfu57tc6.cloudfront.net
#cdn-lfs-eu-1		d1wmdo6fswuln8.cloudfront.net
#cdn-lfs-us-1		d3tt2suyqs9zqv.cloudfront.net

map $host $huggingface_backend {
	hostnames;
	discuss.huggingface.co	hellohellohello.hosted-by-discourse.com;
	ui.endpoints.huggingface.co	cname.vercel-dns.com;
	store.huggingface.co	cname.vercel-dns.com;
	dell.huggingface.co	cname.vercel-dns.com;
	home.huggingface.co	hugging-face.customdomains.okta.com;
	default		huggingface-co;
}

map $host $huggingface_rewrite {
	hostnames;
	api-inference.huggingface.co	"https://huggingface.co/docs/api-inference/index";
	ui.autotrain.huggingface.co	"https://huggingface.co/autotrain";
	thumbnails.huggingface.co	"https://cdn-thumbnails.huggingface.co${request_uri}";
	default		"";
}
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name .huggingface.co;

	access_log logs/huggingface-access.log lite buffer=4k flush=5s if=$needlog;
	error_log NUL;

	if ($huggingface_rewrite != "" ) { return 307 $huggingface_rewrite; }

	location / {
		resolver 119.29.29.29:53 valid=1h ipv4=on ipv6=on;
		proxy_pass https://$huggingface_backend;
		proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504 non_idempotent;
		include shared-proxy-params-empty-sni.conf;
	}
}
#   huggingface End