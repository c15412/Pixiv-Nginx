#   Pixiv Start
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name .pixiv.net;

	location / {
		grpc_pass grpcs://sni-gate;
		include shared-proxy-params-1.conf;
		grpc_next_upstream error timeout http_429 http_500 http_502 http_503 http_504 non_idempotent;
		grpc_ssl_name $http_Host;
	}

	# Proxying WebSockets
	location /ws/ {
		proxy_pass https://127.0.0.2:343;
		include shared-proxy-params-ws.conf;
		proxy_ssl_name $Host;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name downloads.fanbox.cc;

	location / {
		grpc_pass grpcs://downloads-fanbox-cc;
		include shared-proxy-params-empty-sni.conf;
		grpc_next_upstream error timeout http_429 http_500 http_502 http_503 http_504 non_idempotent;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name api.fanbox.cc;
	server_name .fanbox.cc;

	client_max_body_size 50M;

	location / {
		grpc_pass grpcs://api-fanbox-cc;
		include shared-proxy-params-1.conf;
		grpc_ssl_name "${http_host}.";
		grpc_next_upstream error timeout http_429 http_500 http_502 http_503 http_504;
	}
}

