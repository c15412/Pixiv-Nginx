#   Pixiv Start
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name www.pixiv.net;
	server_name api.pixiv.net;
	server_name .pixiv.net;
	server_name .fanbox.cc;

	client_max_body_size 50M;

	location / {
		#proxy_pass https://www-pixiv-net;
		#include shared-proxy-params-empty-sni.conf;
		#proxy_next_upstream error timeout http_429 http_404 http_500 http_502 http_503 http_504 non_idempotent;
		#proxy_read_timeout 5s;
		grpc_pass grpcs://www-pixiv-net;
		grpc_connect_timeout 5;
		grpc_set_header Connection "";
		grpc_set_header :authority $host;
		grpc_set_header Host $http_host;
		grpc_set_header User-Agent $http_user_agent;
		grpc_ssl_server_name on;
		grpc_ssl_name "";
		grpc_next_upstream error timeout http_429 http_404 http_500 http_502 http_503 http_504 non_idempotent;
	}

	# Proxying WebSockets
	location /ws/ {
		proxy_pass https://www-pixiv-net;
		include shared-proxy-params-ws.conf;
	}
}

