#   dlsite Start
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name download.dlsite.com media.dlsite.com;

	location / {
		proxy_pass https://CloudFront;
		include shared-proxy-params-empty-sni.conf;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name login.dlsite.com;

	location / {
		#proxy_pass https://dlsite-login;
	resolver 223.6.6.6:53 valid=3600s ipv4=on ipv6=on;
	set $rewrite_host "login.dlsite.com.cdn.cloudflare.net.";
		proxy_pass https://$rewrite_host;
		include shared-proxy-params-snidot.conf;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name www.dlsite.com ssl.dlsite.com img.dlsite.jp media.ci-en.jp;

	location / {
		proxy_pass https://CloudFlare;
		include shared-proxy-params-snidot.conf;
	}
}
#   dlsite End