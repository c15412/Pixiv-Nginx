#	Discord Start
upstream DiscordApp-com {
	zone DiscordApp-com 64k;
	hash $connection consistent;
	server 162.159.129.233:443;
	server 162.159.130.233:443;
	server 162.159.133.233:443;
	server 162.159.134.233:443;
	server 162.159.135.233:443;
	server [2606:4700:57::162.159.129.233]:443;
	server [2606:4700:3111::162.159.130.233]:443;
	server [2606:4700:3112::162.159.133.233]:443;
	keepalive 32;
	keepalive_time 1h;
	keepalive_timeout 120;
	keepalive_requests 10000;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name .discordapp.com;

	access_log logs/Discord-access.log lite buffer=4k flush=5s if=$needlog;
	#access_log off;
	error_log NUL;

	location / {
		proxy_pass https://DiscordApp-com;
		include shared-proxy-params-1.conf;
		proxy_ssl_name "dis,cordapp.com";
	}
}

upstream Discord-com {
	zone Discord-com 64k;
	hash $connection consistent;
	server 162.159.135.232:443;
	server 162.159.136.232:443;
	server 162.159.137.232:443;
	server 162.159.138.232:443;
	server 162.159.128.233:443;
	server [2606:4700:57::162.159.128.233]:443;
	server [2606:4700:3111::162.159.135.232]:443;
	server [2606:4700:3112::162.159.136.232]:443;
	keepalive 32;
	keepalive_time 1h;
	keepalive_timeout 120;
	keepalive_requests 10000;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name .discord.com;

	access_log logs/Discord-access.log lite buffer=4k flush=5s if=$needlog;
	#access_log off;
	error_log NUL;

	location / {
		proxy_pass https://Discord-com;
		proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504 non_idempotent;
		tcp_nodelay on;
		proxy_set_header Cookie $http_cookie;
		proxy_ssl_name "dis,cord.com";
		include shared-proxy-params-1.conf;
	}
}

