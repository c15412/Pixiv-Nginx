upstream dl-discordapp-net {
	zone dl-discordapp-net 64k;
	least_conn;
	server 162.159.128.232:443;
	server 162.159.129.232:443;
	server 162.159.130.232:443;
	server 162.159.133.232:443;
	server 162.159.134.232:443;
	server [2606:4700:57::162.159.128.232]:443;
	server [2606:4700:3111::162.159.129.232]:443;
	server [2606:4700:3112::162.159.130.232]:443;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name dl.discordapp.net;

	access_log logs/Discord-access.log lite buffer=4k flush=5s if=$needlog;
	#access_log off;
	error_log NUL;

	location / {
		proxy_pass https://dl-discordapp-net;
		proxy_next_upstream error timeout http_403 http_429 http_500 http_502 http_503 http_504 non_idempotent;
		include shared-proxy-params-1.conf;
		proxy_ssl_name "dl.dis,cordapp.net";
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name media.discordapp.net;
	server_name images-ext-2.discordapp.net;
	server_name images-ext-1.discordapp.net;

	access_log logs/Discord-access.log lite buffer=4k flush=5s if=$needlog;
	#access_log off;
	error_log NUL;

	location / {
		proxy_pass https://dl-discordapp-net;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host media.discordapp.net;
		proxy_set_header User-Agent $http_user_agent;
		proxy_buffering off;
		proxy_ssl_server_name on;
		proxy_ssl_name "images-ext-1.dis,cordapp.net";
	}
}
#	Discord End