upstream gumroad {
	hash $connection consistent;
	server 104.17.176.98:443;
	server 104.18.243.99:443;
	server [2606:4700:9adb::6812:f363]:443;
	server [2606:4700:9aeb::6812:f363]:443;
	server [2606:4700:9a6b::6812:f363]:443;
	server [2606:4700:90db::6812:f363]:443;
	server [2606:4700:3035::6812:f363]:443;
	server [2606:4700:3032::6812:f363]:443;
	server [2606:4700:3111::6812:f363]:443;
	server [2606:4700:57::6812:f363]:443;
	server [2606:4700:100::6812:f363]:443;
	server [2606:4700:20::6812:f363]:443;
	server [2606:4700::6812:f363]:443;
	keepalive 16;
	keepalive_time 1h;
	keepalive_timeout 300s;
	keepalive_requests 10000;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name .gumroad.com;

	client_max_body_size 50M;

	location / {
		proxy_pass https://gumroad;
		include shared-proxy-params-empty-sni.conf;
	}
}
#   gumroad End