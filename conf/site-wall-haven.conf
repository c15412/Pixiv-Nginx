#   WallHaven Start
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name wallhaven.cc www.wallhaven.cc static.wallhaven.cc alpha.wallhaven.cc;

	client_max_body_size 50M;
	http2_max_concurrent_streams 8;

	location / {
		grpc_pass grpcs://CloudFlare;
		proxy_next_upstream error timeout http_429 http_500 http_502 http_503 http_504;
		include shared-proxy-params-snidot.conf;
	}
}
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name w.wallhaven.cc th.wallhaven.cc;

	client_max_body_size 50M;
	http2_max_concurrent_streams 8;

	location / {
		proxy_pass https://CloudFlare-LB;
		proxy_next_upstream error timeout http_429 http_500 http_502 http_503 http_504;
		include shared-proxy-params-snidot.conf;
	}
}
#   WallHaven End