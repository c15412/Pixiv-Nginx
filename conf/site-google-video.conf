log_format  Google  '［$time_local］－	请求耗时"$request_time"	$http_host	服务器地址：	$proxy_host	$server_protocol\n	上游状态	"$upstream_status"	上游地址：	"$upstream_addr"	$upstream_http_server\n	$status	总字节数$body_bytes_sent';
#	请求大小：$request_length
#　　GoogleVideo.com
split_clients	$gv_prefix	$gv_suffix {
	20%	"gvt1.com";
	26%	"xn--ngstr-lra8j.com";
	20%	"bdn.dev";
	4%	"c.2mdn.net";
	4%	"snap.gvt1.com";
#	3%	"gcpcdn.gvt1.com";
	4%	"offline-maps.gvt1.com";
#	20%	"c.bigcache.googleapis.com";
	22%	"c.googlesyndication.com";
}
map	$host	$gv_prefix	{
	~^(?<prefix>[a-zA-Z0-9_.-]*?sn-[a-zA-Z0-9_.-]+)\.googlevideo\.com$	$prefix;
	~^(?<prefix>[a-zA-Z0-9_.-]*?sn-[a-zA-Z0-9_.-]+)\.c\.youtube\.com$	$prefix;
	default	"";
}
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name	*.googlevideo.com	*.c.youtube.com;

	#access_log off;
	access_log logs/GoogleVideo-access.log lite buffer=4k flush=5s if=$needlog;
	error_log NUL;

	location / {
	if ( $gv_prefix = "" ) { return 444; }
		resolver 119.29.29.29:53 223.6.6.6:53 valid=1h ipv4=off ipv6=on;
		proxy_pass https://${gv_prefix}.${gv_suffix}:443;
		proxy_ssl_name $proxy_host;
		proxy_connect_timeout 4;
		include shared-proxy-params-1.conf;
		proxy_ssl_session_reuse on;

		keepalive_timeout 600;
		keepalive_requests 10000;
	}
}
#	GoogleVideo End