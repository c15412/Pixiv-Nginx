#   github Start
log_format  Github  '［$time_local］－　请求耗时"$request_time"　$http_host　服务器地址：$proxy_host　$server_protocol\n　上游状态"$upstream_status"　上游地址："$upstream_addr"\n　$status　总字节数$body_bytes_sent';
map $host $github_backend {
	hostnames;
	github.com	Github-com;
	www.github.com	Github-com;
	gist.github.com	Github-com;
	codeload.github.com	codeload-github-com;
	api.github.com	api-github-com;
	redirect.github.com	redirect-github-com;
	wiki.github.com	redirect-github-com;
	next.github.com	redirect-github-com;
	gists.github.com	redirect-github-com;
	status.github.com	redirect-github-com;
	copilot.github.com	redirect-github-com;
	startups.github.com	redirect-github-com;
	services.github.com	redirect-github-com;
	community.github.com	redirect-github-com;
	partner.github.com	redirect-github-com;
	education.github.com	edu-github-com;
	enterprise.github.com	edu-github-com;
	classroom.github.com	edu-github-com;
	central.github.com	edu-github-com;
	collector.github.com	edu-github-com;
	default	$host;
}
upstream Github-com {
	hash $connection consistent;
	server 20.205.243.166:443;#新加坡
	server 20.27.177.113:443;#日本
	server 20.200.245.247:443;#韩国？
	server 20.207.73.82:443;#印度
	server 20.233.83.145:443;#Dubai迪拜
	keepalive 32;
	keepalive_time 1h;
	keepalive_timeout 300s;
	keepalive_requests 4000;
}
