#注释：153后缀现仅供github.io

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name .github.com;

	access_log logs/Github-access.log Github buffer=4k flush=5s if=$needlog;
	error_log logs/Github-error.log;

	location / {
		proxy_pass https://$github_backend;
		include shared-proxy-params-1.conf;
	}
}

server {
	listen 80;
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name .github.io .githubusercontent.com analytics.githubassets.com lab.github.com assets-cdn.github.com pages.github.com resources.github.com developer.github.com partner.github.com desktop.github.com guides.github.com support.github.com unity.github.com;

	access_log logs/Github-access.log Github buffer=4k flush=5s if=$needlog;
	error_log logs/Github-error.log;

	location / {
		proxy_pass https://githubusercontent-com;
		include shared-proxy-params-1.conf;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name docs.github.com;
	server_name .githubassets.com;

	access_log logs/Github-access.log Github buffer=4k flush=5s if=$needlog;
	error_log logs/Github-error.log;

	location / {
		proxy_pass https://githubusercontent-com;
		include shared-proxy-params-1.conf;
	}
}
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name assets.github.dev;

	access_log logs/Github-access.log Github buffer=4k flush=5s if=$needlog;
	error_log logs/Github-error.log;

	location / {
		proxy_pass https://githubassets-com;
		include shared-proxy-params-1.conf;
		proxy_ssl_name $http_host;
	}
}
#	github End
