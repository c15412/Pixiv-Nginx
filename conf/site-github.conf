#注释：153后缀现仅供github.io

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name	.github.com;

	access_log logs/Github-access.log Github buffer=4k flush=5s if=$needlog;
	error_log logs/Github-error.log;

	location / {
		resolver 119.29.29.29:53 valid=300 ipv4=on ipv6=on;
		proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
		proxy_pass https://$github_backend;
		include shared-proxy-params-empty-sni.conf;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name	alive.github.com live.github.com;

	access_log logs/Github-access.log Github buffer=4k flush=5s if=$needlog;
	error_log logs/Github-error.log;

	location / {
		proxy_pass https://alive-github-com;
		include shared-proxy-params-ws.conf;
		proxy_ssl_name "";
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name	.github.io	.githubusercontent.com;

	access_log logs/Github-access.log Github buffer=4k flush=5s if=$needlog;
	error_log NUL;

	location / {
		proxy_pass https://githubusercontent-com;
		proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
		include shared-proxy-params-empty-sni.conf;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name
	assets.github.dev
	.githubassets.com
	docs.github.com;

	access_log logs/Github-access.log Github buffer=4k flush=5s if=$needlog;
	error_log NUL;

	location / {
		proxy_pass https://github-assets;
		proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
		include shared-proxy-params-empty-sni.conf;
	}
}
